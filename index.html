<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body><title>Cartography Ad Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%2711%27 fill=%27%2324362C%27/%3E%3Cpath d=%27M28.9 12.6A11.3 11.3 0 1 0 28.9 27.4%27 fill=%27none%27 stroke=%27%23F3EEE2%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M20 13.4c.7 4.4 2.2 5.9 6.6 6.6-4.4.7-5.9 2.2-6.6 6.6-.7-4.4-2.2-5.9-6.6-6.6 4.4-.7 5.9-2.2 6.6-6.6z%27 fill=%27%23D9B26B%27/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sen:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: SaaS shell. Fixed left rail (logo, sections, freshness) + sticky top bar (page title, search, update pill).
   Sections: Overview (KPIs, digest, charts) · Ad library (masonry wall) · Products (price tiers) · Hooks & angles ·
   Brands (incl. like-minded brands' CPAS check) · Saved. One detail sheet for any ad. Phones get a bottom tab bar. */
:root {
  --bg: #F5F4EF;
  --surface: #FFFFFF;
  --raised: #FFFFFF;
  --sunk: #EEECE5;
  --ink: #1E2220;
  --ink-2: #3A3F3B;
  --muted: #6D695C;
  --line: #E3E0D6;
  --brand: #2C332F;
  --on-brand: #F5F4EF;
  --sage: #6F8F78;
  --sage-soft: #E5ECE5;
  --gold: #A87A2E;
  --gold-soft: #F4EBDB;
  --slate: #4E6C8A;
  --rose: #A65F5F;
  --sand: #C9B98F;
  --good: #3F7A4E;
  --shadow: 0 1px 2px rgba(30, 34, 32, .06), 0 4px 16px rgba(30, 34, 32, .06);
  --shadow-lift: 0 2px 4px rgba(30, 34, 32, .08), 0 12px 32px rgba(30, 34, 32, .12);
  --scrim: rgba(20, 22, 20, .5);
  --font: "Sen", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 12px;
  --r-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131614; --surface: #1B1F1C; --raised: #222723; --sunk: #262B27; --ink: #ECEAE3; --ink-2: #D2D0C8; --muted: #A49E8A;
    --line: #2F3530; --brand: #D3DECB; --on-brand: #131614; --sage: #8FB399; --sage-soft: #26332A; --gold: #D9B26B; --gold-soft: #3A3121;
    --slate: #8EAACB; --rose: #D08B8B; --sand: #8C7F5E; --good: #7FC08F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25); --shadow-lift: 0 2px 6px rgba(0, 0, 0, .4), 0 14px 36px rgba(0, 0, 0, .45);
    --scrim: rgba(0, 0, 0, .65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131614; --surface: #1B1F1C; --raised: #222723; --sunk: #262B27; --ink: #ECEAE3; --ink-2: #D2D0C8; --muted: #A49E8A;
  --line: #2F3530; --brand: #D3DECB; --on-brand: #131614; --sage: #8FB399; --sage-soft: #26332A; --gold: #D9B26B; --gold-soft: #3A3121;
  --slate: #8EAACB; --rose: #D08B8B; --sand: #8C7F5E; --good: #7FC08F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25); --shadow-lift: 0 2px 6px rgba(0, 0, 0, .4), 0 14px 36px rgba(0, 0, 0, .45);
  --scrim: rgba(0, 0, 0, .65); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* shell */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px 18px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--line); background: var(--surface); }
.logo { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.logo svg { width: 38px; height: 38px; flex: none; filter: drop-shadow(0 2px 6px rgba(20, 28, 23, .25)); }
.logo b { display: block; font-size: 19px; font-weight: 800; letter-spacing: -.025em; line-height: 1.05; }
.logo b em, .lock-card b em { font-style: normal; color: var(--gold); }
.logo span { display: block; margin-top: 3px; font-size: 9.5px; white-space: nowrap; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 11px; border: 0; background: none; padding: 9px 10px; border-radius: var(--r-sm); text-align: left; font-weight: 600; color: var(--ink-2); transition: background .15s, color .15s; }
.nav button:hover { background: var(--sunk); }
.nav button[aria-current="page"] { background: var(--sage-soft); color: var(--brand); }
.nav button[aria-current="page"] svg.i { color: var(--sage); }
.nav .n { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; display: grid; gap: 8px; padding: 12px; border-radius: var(--r); background: var(--sunk); font-size: 12px; color: var(--muted); }
.side-foot b { color: var(--ink); font-weight: 700; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; box-shadow: 0 0 0 0 rgba(63, 122, 78, .5); animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(63, 122, 78, .45); } 70% { box-shadow: 0 0 0 8px rgba(63, 122, 78, 0); } 100% { box-shadow: 0 0 0 0 rgba(63, 122, 78, 0); } }

.main { min-width: 0; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 16px; padding: 14px max(24px, env(safe-area-inset-right, 0px)) 14px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.015em; }
.top p { margin: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top > div { min-width: 0; }
.search { margin-left: auto; position: relative; width: min(320px, 34vw); flex: none; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px 9px 36px; font-size: 13.5px; }
.content { padding: 24px max(24px, env(safe-area-inset-right, 0px)) 72px 28px; max-width: 1640px; }
.view { animation: fade .28s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* cards, kpis */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
.panel h3 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
.panel .sub { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1280px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { position: relative; padding: 16px 18px; display: grid; gap: 6px; overflow: hidden; }
.kpi .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--sage-soft); color: var(--sage); }
.kpi .ic.g { background: var(--gold-soft); color: var(--gold); }
.kpi b { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.kpi svg.spark { position: absolute; right: 14px; top: 18px; width: 86px; height: 30px; }
.cols-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.row-a { grid-template-columns: minmax(270px, 1fr) minmax(0, 2fr); }
@media (max-width: 1280px) { .cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols-3 > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  .hero { grid-template-columns: 1fr; } .hero .art { display: none; } }
@media (max-width: 760px) { .cols-3, .row-a { grid-template-columns: 1fr; } .cols-3 > :last-child:nth-child(odd) { grid-column: auto; } }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 20px; align-items: center; background: linear-gradient(135deg, var(--surface), var(--sage-soft)); }
.hero h2 { margin: 6px 0 12px; font-size: 19px; line-height: 1.3; font-weight: 700; text-wrap: balance; }
.hero ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.hero li { position: relative; padding-left: 20px; font-size: 13.5px; color: var(--ink-2); }
.hero li::before { content: ""; position: absolute; left: 2px; top: 7px; width: 8px; height: 8px; border-radius: 3px; background: var(--sage); }
.hero .stand { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.hero .stand button { width: 54px; height: 68px; padding: 0; border: 2px solid var(--surface); border-radius: 9px; overflow: hidden; background: var(--sunk); box-shadow: var(--shadow); transition: transform .18s; }
.hero .stand button:hover { transform: translateY(-3px) rotate(-1deg); }
.hero .stand img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero .art svg { width: 100%; height: auto; display: block; }

/* charts */
.bars { display: grid; gap: 7px; }
.bars button { display: grid; grid-template-columns: minmax(96px, 150px) minmax(0, 1fr) 46px; align-items: center; gap: 10px; border: 0; background: none; padding: 2px 0; text-align: left; font-size: 13px; border-radius: 6px; }
.bars button:hover .track i { filter: brightness(1.12); }
.bars .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 10px; border-radius: 99px; background: var(--sunk); position: relative; overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: var(--sage); transition: width .7s cubic-bezier(.2, .8, .2, 1); }
.bars .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.bars .d { font-size: 11px; font-weight: 700; }
.bars .d.up { color: var(--good); } .bars .d.dn { color: var(--rose); }
.donut { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut svg { width: 150px; height: 150px; flex: none; }
.donut circle { transition: stroke-dasharray .8s cubic-bezier(.2, .8, .2, 1); }
.legend { display: grid; gap: 7px; font-size: 13px; min-width: 0; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend span { color: var(--muted); margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
.colchart { display: grid; gap: 4px; height: 200px; }
.ccol { display: grid; grid-template-rows: minmax(0, 1fr) 20px; min-width: 0; overflow: visible; }
.cols { overflow: hidden; }
.ctrack { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; border-bottom: 1px solid var(--line); min-height: 0; }
.cv { font-size: 11px; line-height: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cbar { width: min(72%, 36px); height: 0; min-height: 0; display: flex; flex-direction: column-reverse; border-radius: 6px 6px 0 0; overflow: hidden; transition: height .7s cubic-bezier(.2, .8, .2, 1); }
.cbar i { display: block; flex-basis: 0; min-height: 2px; }
.cl { font-size: 10.5px; color: var(--muted); text-align: center; white-space: nowrap; padding-top: 5px; overflow: visible; }
.heat { overflow-x: auto; }
.heat table { border-collapse: separate; border-spacing: 3px; font-size: 12px; font-variant-numeric: tabular-nums; }
.heat th { font-weight: 600; color: var(--muted); padding: 4px 8px; text-align: left; white-space: nowrap; }
.heat td { min-width: 54px; height: 30px; text-align: center; border-radius: 6px; background: var(--sunk); }
.toplist { display: grid; gap: 4px; }
.toplist button { display: grid; grid-template-columns: 26px minmax(90px, 170px) minmax(60px, 1fr) 40px; gap: 10px; align-items: center; border: 0; background: none; padding: 6px 4px; border-radius: 8px; text-align: left; font-size: 13px; }
.toplist button:hover { background: var(--sunk); }
.toplist .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.split { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--sunk); }
.split i { display: block; height: 100%; }

/* toolbar + chips */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--sunk); }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.toolbar select { border: 1px solid var(--line); background: var(--surface); padding: 7px 10px; font-size: 12.5px; border-radius: 9px; max-width: 100%; min-width: 0; }
.count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.fbtn { border: 1px solid var(--line); background: var(--surface); padding: 6px 11px; border-radius: 9px; font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.fbtn svg.i { width: 15px; height: 15px; }
.fbtn[aria-expanded="true"] { border-color: var(--sage); }
.fbtn b { background: var(--gold-soft); color: var(--gold); border-radius: 99px; padding: 0 7px; font-size: 11px; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; margin: -8px 0 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); animation: fade .2s both; }
.filters select { border: 1px solid var(--line); background: var(--bg); padding: 7px 10px; font-size: 12.5px; border-radius: 9px; max-width: 100%; min-width: 0; }
.link { border: 0; background: none; font-size: 12.5px; color: var(--sage); font-weight: 600; padding: 4px; }
.active-filter { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 11px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); font-size: 12.5px; font-weight: 600; }
.active-filter button { border: 0; background: none; color: inherit; font-size: 15px; line-height: 1; padding: 0 4px; }

/* wall */
.wall { display: flex; gap: 16px; align-items: flex-start; }
.wall .col { flex: 1 1 0; min-width: 0; display: grid; gap: 16px; align-content: start; }
.card { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; cursor: pointer; text-align: left; padding: 0; width: 100%;
  box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s; animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 22ms); }
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
.media { position: relative; background: var(--sunk); overflow: hidden; }
.media > img, .media > video { width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 18%; }  /* vertical ads keep their top-third hook text */
.media .ph { height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 12px; padding: 16px; text-align: center; }
.pill { position: absolute; top: 9px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 99px; background: rgba(18, 20, 18, .66); color: #F4F2EC; backdrop-filter: blur(4px); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 4px; }
.pill.l { left: 9px; } .pill.r { right: 9px; }
.pill.new { background: #F4F2EC; color: #1d211e; }
.pill svg { width: 11px; height: 11px; fill: currentColor; stroke: none; }
.who { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 11px 9px; display: flex; align-items: center; gap: 7px; background: linear-gradient(to top, rgba(10, 12, 10, .74), rgba(10, 12, 10, 0)); color: #F4F2EC; font-size: 12px; font-weight: 700; }
.av { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex: none; background: var(--line); border: 1.5px solid rgba(255, 255, 255, .7); }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who em { font-style: normal; font-weight: 400; opacity: .8; }
.cbody { padding: 11px 12px 12px; display: grid; gap: 9px; }
.hook { font-size: 13.5px; line-height: 1.38; font-weight: 600; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.a { background: var(--sage-soft); color: var(--brand); }
.chip.o { background: var(--gold-soft); color: var(--gold); }
.prod { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 7px; border-radius: 9px; background: var(--sunk); }
.prod img { width: 34px; height: 34px; object-fit: contain; background: #fff; border-radius: 6px; }
.prod .t { font-size: 11.5px; line-height: 1.3; color: var(--ink-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.prod .p { text-align: right; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.prod .p small { display: block; font-weight: 600; font-size: 10px; color: var(--muted); }
.tier-hi { color: var(--gold) !important; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); }
.save { border: 0; background: none; padding: 2px 4px; font-size: 16px; line-height: 1; color: var(--muted); transition: transform .15s; }
.save:hover { transform: scale(1.15); }
.save[aria-pressed="true"] { color: var(--gold); }
.more { text-align: center; margin: 4px 0 40px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 18px; font-weight: 700; border-radius: 10px; box-shadow: var(--shadow); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.empty { max-width: 460px; margin: 40px auto; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 140px; height: auto; }
.empty b { color: var(--ink); font-size: 17px; }

/* skeleton */
.skel { border-radius: var(--r); background: linear-gradient(90deg, var(--sunk) 0%, var(--surface) 50%, var(--sunk) 100%); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* products */
.tiers-head { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tierbox { padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; display: grid; gap: 4px; transition: border-color .15s, transform .15s; }
.tierbox:hover { transform: translateY(-2px); }
.tierbox[aria-pressed="true"] { border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-soft); }
.tierbox b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tierbox .label { display: flex; align-items: center; gap: 6px; }
.tierbox .label i { width: 9px; height: 9px; border-radius: 3px; }
.tierbox span { font-size: 12px; color: var(--muted); }
.tier-sec { margin-top: 26px; }
.tier-sec h3 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; font-size: 17px; font-weight: 800; }
.tier-sec h3 span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
